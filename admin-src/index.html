<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Pulse Wire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper: #F7F7F5; --ink: #14161C; --muted: #6B7280; --line: #E2E4E9;
    --signal: #3D5AFE; --live: #FF4D2E; --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', -apple-system, sans-serif; line-height: 1.5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; font-size: 14px; margin-bottom: 12px; background: white;
  }
  textarea { min-height: 160px; resize: vertical; }
  button {
    background: var(--signal); color: white; border: none; padding: 10px 18px;
    border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: white; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: var(--live); }
  button:disabled { opacity: 0.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-meta { font-size: 12px; color: var(--muted); }
  .btn-group { display: flex; gap: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 4px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--signal); border-bottom-color: var(--signal); font-weight: 600; }
  .hidden { display: none; }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
  .msg.error { background: #FDE8E4; color: #B0330F; }
  .msg.ok { background: #E5F6EE; color: #0F6B3F; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen">
    <h1>Pulse Wire Admin</h1>
    <p class="sub">Login to manage posts</p>
    <div class="card" style="max-width:400px;">
      <div id="loginMsg"></div>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button onclick="doLogin()" style="width:100%">Login</button>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="top-bar">
      <div>
        <h1>Pulse Wire Admin</h1>
        <p class="sub" id="whoami"></p>
      </div>
      <button class="secondary" onclick="doLogout()">Logout</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="posts" onclick="switchTab('posts')">Posts</div>
      <div class="tab" data-tab="new" onclick="switchTab('new')">New Post</div>
      <div class="tab hidden" id="adminsTab" data-tab="admins" onclick="switchTab('admins')">Manage Admins</div>
    </div>

    <div id="tab-posts">
      <div id="postsList" class="card">Loading...</div>
    </div>

    <div id="tab-new" class="hidden">
      <div class="card">
        <div id="postMsg"></div>
        <input type="hidden" id="editingId">
        <label>Title</label>
        <input type="text" id="postTitle" placeholder="Article headline">
        <label>Category</label>
        <select id="postCategory">
          <option>General</option>
          <option>Technology</option>
          <option>Business</option>
          <option>Sports</option>
          <option>Entertainment</option>
        </select>
        <label>Meta Description (SEO, 1-2 lines)</label>
        <input type="text" id="postMeta" placeholder="Short summary for search engines">
        <label>Body</label>
        <textarea id="postBody" placeholder="Full article text..."></textarea>
        <label>Image (optional)</label>
        <input type="file" id="postImage" accept="image/*">
        <div id="imagePreviewWrap"></div>
        <button onclick="savePost()" id="saveBtn">Publish Post</button>
        <button class="secondary" onclick="resetForm()" style="margin-left:8px;">Clear</button>
      </div>
    </div>

    <div id="tab-admins" class="hidden">
      <div id="adminsList" class="card">Loading...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://oyhhgsqdmxfunztlkwku.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95aGhnc3FkbXhmdW56dGxrd2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTU0MTEsImV4cCI6MjEwMDg5MTQxMX0.qo1WgMMkQ7BAywk-I2XKVUsyBlQBYp9MnI063ysI0Qk";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let currentRole = null;

  function slugify(str) {
    return str.toLowerCase().replace(/[^a-z0-9\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 80);
  }

  async function doLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const msg = document.getElementById("loginMsg");
    msg.innerHTML = "";

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      msg.innerHTML = `<div class="msg error">${error.message}</div>`;
      return;
    }
    await afterLogin();
  }

  async function doLogout() {
    await sb.auth.signOut();
    location.reload();
  }

  async function afterLogin() {
    const { data: { user } } = await sb.auth.getUser();
    currentUser = user;

    const { data: profile, error } = await sb.from("profiles").select("role").eq("id", user.id).single();
    if (error || !profile || !["admin", "superadmin"].includes(profile.role)) {
      document.getElementById("loginMsg").innerHTML = `<div class="msg error">Aapke account ko admin access nahi hai.</div>`;
      await sb.auth.signOut();
      return;
    }
    currentRole = profile.role;

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("whoami").textContent = `${user.email} · ${currentRole}`;

    if (currentRole === "superadmin") {
      document.getElementById("adminsTab").classList.remove("hidden");
    }

    loadPosts();
  }

  function switchTab(name) {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    document.querySelector(`.tab[data-tab="${name}"]`).classList.add("active");
    ["posts", "new", "admins"].forEach((t) => {
      document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== name);
    });
    if (name === "posts") loadPosts();
    if (name === "admins") loadAdmins();
  }

  async function loadPosts() {
    const list = document.getElementById("postsList");
    list.innerHTML = "Loading...";
    const { data, error } = await sb.from("posts").select("*").order("pub_date", { ascending: false });
    if (error) {
      list.innerHTML = `<div class="msg error">${error.message}</div>`;
      return;
    }
    if (!data.length) {
      list.innerHTML = "<p>Koi post nahi hai abhi.</p>";
      return;
    }
    list.innerHTML = data.map((p) => `
      <div class="row">
        <div>
          <div class="row-title">${p.title}</div>
          <div class="row-meta">${p.category} · ${p.is_manual ? "Manual" : "Auto"} · ${p.status} · ${new Date(p.pub_date).toLocaleDateString()}</div>
        </div>
        <div class="btn-group">
          <button class="secondary" onclick="editPost(${p.id})">Edit</button>
          <button class="danger" onclick="deletePost(${p.id})">Delete</button>
        </div>
      </div>
    `).join("");
  }

  async function editPost(id) {
    const { data, error } = await sb.from("posts").select("*").eq("id", id).single();
    if (error) { alert(error.message); return; }

    document.getElementById("editingId").value = data.id;
    document.getElementById("postTitle").value = data.title;
    document.getElementById("postCategory").value = data.category;
    document.getElementById("postMeta").value = data.meta_description || "";
    document.getElementById("postBody").value = data.body;

    switchTab("new");
    document.querySelector('.tab[data-tab="new"]').classList.add("active");
    document.querySelector('.tab[data-tab="posts"]').classList.remove("active");
  }

  async function deletePost(id) {
    if (!confirm("Pakka delete karna hai?")) return;
    const { error } = await sb.from("posts").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    loadPosts();
  }

  async function savePost() {
    const msg = document.getElementById("postMsg");
    const id = document.getElementById("editingId").value;
    const title = document.getElementById("postTitle").value.trim();
    const category = document.getElementById("postCategory").value;
    const meta = document.getElementById("postMeta").value.trim();
    const body = document.getElementById("postBody").value.trim();
    const imageFile = document.getElementById("postImage").files[0];

    if (!title || !body) {
      msg.innerHTML = `<div class="msg error">Title aur Body zaroori hai.</div>`;
      return;
    }

    document.getElementById("saveBtn").disabled = true;
    msg.innerHTML = `<div class="msg ok">Saving...</div>`;

    let imageUrl = null;
    if (imageFile) {
      const fileName = `${Date.now()}-${imageFile.name}`;
      const { error: uploadError } = await sb.storage.from("post-images").upload(fileName, imageFile);
      if (uploadError) {
        msg.innerHTML = `<div class="msg error">Image upload failed: ${uploadError.message}</div>`;
        document.getElementById("saveBtn").disabled = false;
        return;
      }
      const { data: urlData } = sb.storage.from("post-images").getPublicUrl(fileName);
      imageUrl = urlData.publicUrl;
    }

    const slug = slugify(title);
    const payload = {
      title, category, body,
      meta_description: meta,
      slug,
      is_manual: true,
      status: "published",
      author_id: currentUser.id,
    };
    if (imageUrl) payload.image_url = imageUrl;

    let result;
    if (id) {
      result = await sb.from("posts").update(payload).eq("id", id);
    } else {
      payload.pub_date = new Date().toISOString();
      result = await sb.from("posts").insert(payload);
    }

    document.getElementById("saveBtn").disabled = false;

    if (result.error) {
      msg.innerHTML = `<div class="msg error">${result.error.message}</div>`;
    } else {
      msg.innerHTML = `<div class="msg ok">Saved!</div>`;
      resetForm();
      switchTab("posts");
    }
  }

  function resetForm() {
    document.getElementById("editingId").value = "";
    document.getElementById("postTitle").value = "";
    document.getElementById("postMeta").value = "";
    document.getElementById("postBody").value = "";
    document.getElementById("postImage").value = "";
    document.getElementById("postMsg").innerHTML = "";
  }

  async function loadAdmins() {
    const list = document.getElementById("adminsList");
    list.innerHTML = "Loading...";
    const { data, error } = await sb.from("profiles").select("*").order("created_at");
    if (error) {
      list.innerHTML = `<div class="msg error">${error.message}</div>`;
      return;
    }
    list.innerHTML = data.map((p) => `
      <div class="row">
        <div>
          <div class="row-title">${p.email}</div>
          <div class="row-meta">Role: ${p.role}</div>
        </div>
        <div class="btn-group">
          <button class="secondary" onclick="setRole('${p.id}','admin')">Make Admin</button>
          <button onclick="setRole('${p.id}','superadmin')">Make Superadmin</button>
        </div>
      </div>
    `).join("");
  }

  async function setRole(id, role) {
    const { error } = await sb.from("profiles").update({ role }).eq("id", id);
    if (error) { alert(error.message); return; }
    loadAdmins();
  }

  (async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await afterLogin();
  })();
</script>
</body>
</html>
